{% extends "blog/base.html" %}
{% block content %}
    <div class="content-section">
        <form method="POST" action="{% url 'logout-confirm' %}">
            {% csrf_token %}
            <fieldset class="form-group">
                <legend class="border-bottom mb-2">Log Out</legend>
                <h2>Are you sure you want to log out?</h2>
            </fieldset>
            <div class="form-group">
                <button class="btn btn-outline-danger custom-red-button" type="submit">Log Out</button>
                <a class="btn btn-outline-secondary" href="{% url 'blog-home' %}">Cancel</a>
            </div>
        </form>
    </div>
{% endblock content %}
